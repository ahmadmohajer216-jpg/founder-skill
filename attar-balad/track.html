<head>
<meta charset="utf-8">

<title>پیگیری سفارش — عطار بلد</title>
<meta name="description" content="وضعیت سفارش خود را با کد سفارش پیگیری کنید.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314532d' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M20 4c.4 9.4-5.2 13.4-11 13.4H4.6C4.2 8.9 9.8 4 20 4z'/%3E%3Cpath d='M4.8 19.6c2.8-4.8 6-7.8 10.4-10'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="ab-body" data-page="track">
<a class="ab-skip" href="#main">رفتن به محتوای اصلی</a>
<div id="abHeader"></div>

<main id="main">
  <div class="ab-container">
    <nav class="ab-breadcrumb" aria-label="مسیر صفحه">
      <a href="index.html">خانه</a><span aria-hidden="true">/</span><span>پیگیری سفارش</span>
    </nav>
    <div class="ab-pagehead">
      <h1>پیگیری سفارش</h1>
      <p>کد سفارش را وارد کنید تا وضعیت آماده‌سازی و ارسال را ببینید. کد سفارش پس از ثبت خرید نمایش داده می‌شود.</p>
    </div>

    <div style="max-width:560px">
      <form class="ab-panel" id="trackForm" novalidate>
        <label class="ab-field"><span class="ab-label">کد سفارش</span>
          <input class="ab-input" id="trackCode" placeholder="AB-12345" dir="ltr" autocomplete="off" required></label>
        <label class="ab-field"><span class="ab-label">شمارهٔ موبایل <span>(اختیاری)</span></span>
          <input class="ab-input" id="trackPhone" inputmode="tel" placeholder="۰۹۱۲۱۲۳۴۵۶۷" autocomplete="tel"></label>
        <button class="ab-btn" type="submit">پیگیری</button>
      </form>
      <div id="trackResult" class="ab-mt-4" hidden></div>
    </div>
  </div>
</main>

<div id="abFooter"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
