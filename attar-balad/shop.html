<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروشگاه — عطار بلد</title>
<meta name="description" content="فروشگاه عطار بلد: گیاهان دارویی، دمنوش، ادویه، عرقیات، دانه و خشکبار. فیلتر بر اساس دسته، قیمت و موجودی.">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="ab-body" data-page="shop">
<a class="ab-skip" href="#main">رفتن به محتوای اصلی</a>
<div id="abHeader"></div>

<main id="main">
  <div class="ab-container">
    <nav class="ab-breadcrumb" aria-label="مسیر صفحه">
      <a href="index.html">خانه</a><span aria-hidden="true">/</span>
      <a href="shop.html">فروشگاه</a><span aria-hidden="true">/</span>
      <span id="shopCrumb">همهٔ محصولات</span>
    </nav>
    <div class="ab-pagehead">
      <h1 id="shopTitle">همهٔ محصولات</h1>
      <p id="shopLead">۴۹ قلم گیاه، ادویه، دمنوش و خشکبار؛ هر قلم با تصویر و منبع مشخص. کالاهایی که عکس نهایی‌شان آماده نشده، با «تصویر موقت» نمایش داده می‌شوند.</p>
    </div>

    <div class="ab-shop">
      <aside class="ab-filters" aria-label="فیلترها">
        <div class="ab-filters__group">
          <span class="ab-filters__title">دسته‌بندی</span>
          <div id="filterCats" role="radiogroup" aria-label="دسته‌بندی"></div>
        </div>
        <div class="ab-filters__group">
          <label class="ab-filters__title" for="filterPrice">محدودهٔ قیمت</label>
          <select class="ab-select ab-select--sm" id="filterPrice">
            <option value="">همهٔ قیمت‌ها</option>
            <option value="0-100000">زیر ۱۰۰ هزار تومان</option>
            <option value="100000-250000">۱۰۰ تا ۲۵۰ هزار</option>
            <option value="250000-500000">۲۵۰ تا ۵۰۰ هزار</option>
            <option value="500000-up">بالای ۵۰۰ هزار</option>
          </select>
        </div>
        <div class="ab-filters__group">
          <label class="ab-choice"><input type="checkbox" id="filterStock"><span>فقط کالاهای موجود</span></label>
        </div>
        <a class="ab-btn ab-btn--ghost ab-btn--sm" href="shop.html">حذف همهٔ فیلترها</a>
      </aside>

      <div>
        <div class="ab-shop__bar">
          <span class="ab-shop__result" id="shopCount">۴۹ محصول</span>
          <div class="ab-row">
            <label class="ab-sr" for="shopSort">مرتب‌سازی</label>
            <select class="ab-select ab-select--sm" id="shopSort" style="min-width:170px">
              <option value="featured">پیشنهاد عطار بلد</option>
              <option value="cheap">ارزان‌ترین</option>
              <option value="expensive">گران‌ترین</option>
              <option value="rating">بیشترین امتیاز</option>
              <option value="name">الفبایی</option>
            </select>
          </div>
        </div>
        <div class="ab-chips" id="shopChips" style="margin-bottom:16px"></div>
        <div class="ab-products" id="shopGrid"></div>
        <div class="ab-center ab-mt-6"><button class="ab-btn ab-btn--outline" type="button" id="shopMore" hidden>نمایش بیشتر</button></div>
      </div>
    </div>
  </div>
</main>

<div id="abFooter"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
